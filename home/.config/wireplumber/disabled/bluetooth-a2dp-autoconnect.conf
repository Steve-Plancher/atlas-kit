## Auto-connect A2DP playback/capture and headset (HFP/HSP) profiles on Bluetooth devices.
## Headset profiles are needed for headset mics and auto-switching to headset mode when recording.
## This helps speakers and receivers expose their audio profiles without
## requiring manual PipeWire/WirePlumber recovery.

monitor.bluez.rules = [
  {
    matches = [
      {
        device.name = "~bluez_card.*"
      }
    ]
    actions = {
      update-props = {
        bluez5.auto-connect = [ hfp_hf hsp_hs a2dp_sink a2dp_source ]
      }
    }
  }
]
